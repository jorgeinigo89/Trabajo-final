random_forest:
  n_estimators: 100       # number of trees (range: 50–300)
  max_depth: 10           # maximum depth of each tree (range: 3–20)
  random_state: 42

mlp:
  num_epochs: 30          # training epochs (range: 10–100)
  learning_rate: 0.001    # AdamW learning rate
  weight_decay: 0.01      # AdamW weight decay (L2 regularisation)
  dropout: 0.5            # dropout rate applied after each hidden layer
  hidden_layers:
    - 128
    - 64
    - 32
  scheduler:
    step_size: 10         # StepLR: decay every N epochs
    gamma: 0.1            # StepLR: multiplicative decay factor

data:
  test_size: 0.2
  val_size: 0.1           # fraction of training data used as validation
  random_state: 42
